<section class="auth-card">
  <h2>{{ isLoginMode ? 'Logowanie' : 'Rejestracja' }}</h2>
  <form [formGroup]="authForm" (ngSubmit)="submit()">
    <label>
      <span>Nazwa użytkownika</span>
      <input formControlName="username" type="text" />
    </label>

    <label *ngIf="!isLoginMode">
      <span>E-mail</span>
      <input formControlName="email" type="email" />
    </label>

    <label>
      <span>Hasło</span>
      <input formControlName="password" type="password" />
    </label>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button type="submit">{{ isLoginMode ? 'Zaloguj się' : 'Utwórz konto' }}</button>
  </form>

  <button class="toggle" type="button" (click)="toggleMode()">
    {{ isLoginMode ? 'Nie masz konta? Zarejestruj się' : 'Masz już konto? Zaloguj się' }}
  </button>
</section>
